<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼츠 애니메이션 메이커</title>
<meta name="description" content="부동산 뉴스 3개를 넣으면 9:16 쇼츠 애니메이션으로 만들어 영상으로 저장합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e1424; --card:#161e33; --text:#eef1f7; --muted:#a7b0c4; --accent:#ffd600; --line:#253050; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.6; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:24px; grid-template-columns:minmax(0,380px) minmax(0,1fr); align-items:start; }
  @media (max-width:760px) { main { grid-template-columns:minmax(0,1fr); } }
  h1 { font-size:22px; margin:0 0 4px; grid-column:1/-1; }
  h1 em { color:var(--accent); font-style:normal; }
  .stage { position:sticky; top:12px; }
  @media (max-width:760px) { .stage { position:static; } }
  canvas { width:100%; max-width:380px; aspect-ratio:9/16; display:block; margin:0 auto; border-radius:16px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .bar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; background:var(--card); color:var(--text); }
  button.primary { background:var(--accent); color:#000; }
  button:disabled { opacity:.5; cursor:default; }
  .progress { height:4px; background:var(--line); border-radius:2px; margin:10px auto 0; max-width:380px; overflow:hidden; }
  .progress > div { height:100%; width:0; background:var(--accent); }
  .status { text-align:center; color:var(--muted); font-size:13px; min-height:20px; margin-top:6px; }
  .card { background:var(--card); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  textarea { resize:vertical; min-height:56px; }
  .row { display:grid; grid-template-columns:1fr 120px; gap:8px; }
  .hint { color:var(--muted); font-size:13px; margin:0; }
</style>
</head>
<body>
<main>
  <h1>부동산 <em>쇼츠 애니메이션</em> 메이커</h1>

  <section class="stage">
    <canvas id="cv" width="1080" height="1920" aria-label="쇼츠 미리보기"></canvas>
    <div class="progress"><div id="prog"></div></div>
    <div class="bar">
      <button id="play" class="primary">▶ 재생</button>
      <button id="restart">⟲ 처음부터</button>
      <button id="rec">● 영상 저장</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section>
    <div class="card">
      <h2>기본 정보</h2>
      <label for="date">날짜</label>
      <input id="date">
      <label for="title">오프닝 제목</label>
      <input id="title">
    </div>
    <div id="newsForms"></div>
    <div class="card">
      <h2>안내</h2>
      <p class="hint">내용을 고치면 미리보기에 바로 반영되고, 이 브라우저에 저장됩니다. "영상 저장"을 누르면 약 30초 동안 실시간으로 녹화한 뒤 파일을 내려받습니다(소리 없음 — 편집 앱에서 AI 음성을 입히세요). 마지막 화면에 "투자 권유 아님 · AI 음성 제작" 안내가 들어갑니다.</p>
    </div>
  </section>
</main>

<script>
(() => {
  const W = 1080, H = 1920;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const FONT = '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

  // ---------- 데이터 ----------
  const today = new Date();
  const days = ['일','월','화','수','목','금','토'];
  const defaultDate = `${today.getMonth()+1}월 ${today.getDate()}일 (${days[today.getDay()]})`;
  const DEFAULTS = {
    date: defaultDate,
    title: '오늘의 부동산 뉴스',
    news: [
      { headline: '여기에 첫 번째 뉴스 헤드라인을 입력하세요', source: '○○일보', icon: 'chart' },
      { headline: '두 번째 뉴스: 매물·분양 소식을 적어보세요', source: '○○경제', icon: 'house' },
      { headline: '세 번째 뉴스: 정책·규제 소식을 적어보세요', source: '○○뉴스', icon: 'policy' },
    ],
  };
  let data = JSON.parse(JSON.stringify(DEFAULTS));
  try {
    const saved = JSON.parse(localStorage.getItem('shorts-data') || 'null');
    if (saved && Array.isArray(saved.news) && saved.news.length === 3) data = saved;
  } catch (e) {}
  const save = () => { try { localStorage.setItem('shorts-data', JSON.stringify(data)); } catch (e) {} };

  // ---------- 타임라인 ----------
  const INTRO = 4, NEWS = 7, OUTRO = 4.5;
  const DURATION = INTRO + NEWS * 3 + OUTRO;

  // ---------- 유틸 ----------
  const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
  const prog = (t, s, d) => clamp((t - s) / d);
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const back = x => { const c = 1.70158, c3 = c + 1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  const YELLOW = '#ffd600', NAVY = '#0e1424', CARD = '#161e33', TEXT = '#eef1f7', MUTED = '#a7b0c4';

  function font(size, weight=700) { ctx.font = `${weight} ${size}px ${FONT}`; }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }

  function wrap(text, maxW) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = []; let line = '';
    for (let word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (line) lines.push(line);
      line = '';
      // 한 단어가 너무 길면 글자 단위로 자르기
      while (ctx.measureText(word).width > maxW) {
        let i = 1;
        while (i < word.length && ctx.measureText(word.slice(0, i+1)).width <= maxW) i++;
        lines.push(word.slice(0, i)); word = word.slice(i);
      }
      line = word;
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- 배경 & 스카이라인 ----------
  const buildings = [];
  { let x = -20, i = 0;
    while (x < W + 20) {
      const w = 90 + hash(i+1) * 110, h = 260 + hash(i+7) * 620;
      buildings.push({ x, w, h, i, shade: 0.55 + hash(i+3) * 0.45 });
      x += w + 6; i++;
    } }

  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1020'); g.addColorStop(.6, '#121a33'); g.addColorStop(1, '#1b2547');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 움직이는 격자
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 2;
    const off = (t * 40) % 120;
    for (let y = -120 + off; y < H; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (let x = 0; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  }

  function drawSkyline(t, rise, alpha=1) {
    ctx.save(); ctx.globalAlpha = alpha;
    for (const b of buildings) {
      const p = easeOut(prog(rise, b.i * 0.05, 0.9));
      const h = b.h * p; if (h <= 1) continue;
      const y = H - h;
      const c = Math.round(28 + 30 * b.shade);
      ctx.fillStyle = `rgb(${c},${c+8},${c+40})`;
      ctx.fillRect(b.x, y, b.w, h);
      // 창문
      for (let wy = y + 30; wy < H - 30; wy += 54) {
        for (let wx = b.x + 18; wx < b.x + b.w - 28; wx += 36) {
          const on = hash(wx * 3.1 + wy * 0.7 + Math.floor(t * 1.5 + hash(wx) * 5)) > 0.55;
          ctx.fillStyle = on ? 'rgba(255,214,0,.85)' : 'rgba(255,255,255,.07)';
          ctx.fillRect(wx, wy, 16, 22);
        }
      }
    }
    ctx.restore();
  }

  // ---------- 장면: 오프닝 ----------
  function drawIntro(lt) {
    drawSkyline(lt, lt);
    const a = easeOut(prog(lt, 0.3, 0.6));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 60);
    // 띠
    font(52, 900); const band = '매일 아침 1분';
    const bw = ctx.measureText(band).width + 64;
    ctx.fillStyle = '#000'; roundRect((W - bw)/2, 380, bw, 96, 18); ctx.fill();
    ctx.fillStyle = YELLOW; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(band, W/2, 430);
    ctx.restore();

    const b = back(prog(lt, 0.7, 0.7));
    ctx.save(); ctx.globalAlpha = clamp(b); ctx.translate(W/2, 640); ctx.scale(0.6 + 0.4*b, 0.6 + 0.4*b);
    font(118, 900); ctx.fillStyle = TEXT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = wrap(data.title, 940);
    lines.forEach((l, i) => ctx.fillText(l, 0, (i - (lines.length-1)/2) * 140));
    ctx.restore();

    const c = easeOut(prog(lt, 1.3, 0.6));
    ctx.save(); ctx.globalAlpha = c;
    font(60, 700); ctx.fillStyle = YELLOW; ctx.textAlign = 'center';
    ctx.fillText(data.date, W/2, 860);
    font(44, 500); ctx.fillStyle = MUTED;
    ctx.fillText('주요 소식 3가지', W/2, 950);
    ctx.restore();
  }

  // ---------- 아이콘 애니메이션 ----------
  function iconChart(lt, cx, cy) {
    const pts = [[-320,140],[-200,60],[-90,110],[20,-10],[130,30],[250,-130],[330,-170]];
    // 축
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx-360, cy-220); ctx.lineTo(cx-360, cy+200); ctx.lineTo(cx+370, cy+200); ctx.stroke();
    const p = easeInOut(prog(lt, 0.6, 1.8));
    const total = pts.length - 1, upto = p * total;
    // 영역
    ctx.beginPath(); ctx.moveTo(cx + pts[0][0], cy + 200);
    let last = pts[0];
    for (let i = 0; i <= total; i++) {
      if (i <= upto) { ctx.lineTo(cx + pts[i][0], cy + pts[i][1]); last = pts[i]; }
      else { const f = upto - (i-1); const a = pts[i-1], b2 = pts[i];
        last = [a[0] + (b2[0]-a[0])*f, a[1] + (b2[1]-a[1])*f]; ctx.lineTo(cx + last[0], cy + last[1]); break; }
    }
    ctx.lineTo(cx + last[0], cy + 200); ctx.closePath();
    const g = ctx.createLinearGradient(0, cy-200, 0, cy+200);
    g.addColorStop(0, 'rgba(255,214,0,.35)'); g.addColorStop(1, 'rgba(255,214,0,0)');
    ctx.fillStyle = g; ctx.fill();
    // 선
    ctx.beginPath(); ctx.moveTo(cx + pts[0][0], cy + pts[0][1]);
    for (let i = 1; i <= total; i++) {
      if (i <= upto) ctx.lineTo(cx + pts[i][0], cy + pts[i][1]);
      else { ctx.lineTo(cx + last[0], cy + last[1]); break; }
    }
    ctx.strokeStyle = YELLOW; ctx.lineWidth = 14; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    // 점
    ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.arc(cx + last[0], cy + last[1], 22 + Math.sin(lt*8)*4, 0, Math.PI*2); ctx.fill();
    // 화살표 배지
    const s = back(prog(lt, 2.4, 0.5));
    if (s > 0) {
      ctx.save(); ctx.translate(cx + 250, cy - 290); ctx.scale(s, s);
      ctx.fillStyle = '#ff4d4f'; roundRect(-110, -50, 220, 100, 50); ctx.fill();
      font(54, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('▲ 상승', 0, 2); ctx.restore();
    }
  }

  function iconHouse(lt, cx, cy) {
    const p = back(prog(lt, 0.5, 0.8));
    ctx.save(); ctx.translate(cx, cy + 40); ctx.scale(p, p);
    // 지붕
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.moveTo(-280, -40); ctx.lineTo(0, -280); ctx.lineTo(280, -40); ctx.closePath(); ctx.fill();
    // 몸체
    ctx.fillStyle = '#e9ecf5'; ctx.fillRect(-220, -40, 440, 280);
    // 문, 창
    ctx.fillStyle = NAVY; ctx.fillRect(-50, 80, 100, 160);
    const lit = Math.sin(lt * 4) > 0 ? YELLOW : '#3a4a7a';
    ctx.fillStyle = lit; ctx.fillRect(-180, 20, 90, 90); ctx.fillRect(90, 20, 90, 90);
    // 굴뚝
    ctx.fillStyle = '#c9ced9'; ctx.fillRect(130, -230, 60, 120);
    ctx.restore();
    // 연기
    for (let i = 0; i < 3; i++) {
      const k = ((lt * 0.6 + i / 3) % 1);
      ctx.fillStyle = `rgba(255,255,255,${0.35 * (1-k) * clamp(p)})`;
      ctx.beginPath(); ctx.arc(cx + 160 + Math.sin(k*6)*20, cy - 220 - k*200, 26 + k*30, 0, Math.PI*2); ctx.fill();
    }
    // 가격표 (흔들리며 떨어짐)
    const d = easeOut(prog(lt, 1.6, 0.7));
    if (d > 0) {
      const sw = Math.sin(lt * 3) * 0.12 * d;
      ctx.save(); ctx.translate(cx + 260, cy - 340 + d * 160); ctx.rotate(0.2 + sw);
      ctx.strokeStyle = '#c9ced9'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(0, -40); ctx.stroke();
      ctx.fillStyle = '#ff4d4f'; roundRect(-90, -40, 180, 120, 20); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI*2); ctx.fill();
      font(56, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('매물', 0, 30);
      ctx.restore();
    }
  }

  function iconPolicy(lt, cx, cy) {
    const p = easeOut(prog(lt, 0.5, 0.7));
    ctx.save(); ctx.globalAlpha = p; ctx.translate(cx, cy + (1-p)*80); ctx.rotate(-0.05);
    ctx.fillStyle = '#f4f6fb'; roundRect(-230, -290, 460, 580, 24); ctx.fill();
    ctx.fillStyle = NAVY; font(52, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('정책 발표', 0, -210);
    for (let i = 0; i < 6; i++) {
      const lp = easeOut(prog(lt, 0.9 + i * 0.15, 0.4));
      ctx.fillStyle = '#c9ced9'; roundRect(-170, -120 + i * 60, (i % 3 === 2 ? 220 : 340) * lp, 22, 11); ctx.fill();
    }
    ctx.restore();
    // 도장
    const s = prog(lt, 2.2, 0.35);
    if (s > 0) {
      const sc = 2.2 - 1.2 * easeOut(s);
      ctx.save(); ctx.translate(cx + 150, cy + 180); ctx.rotate(-0.25); ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(s * 2);
      ctx.strokeStyle = '#ff4d4f'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 88, 0, Math.PI*2); ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#ff4d4f'; font(64, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('확정', 0, 4);
      ctx.restore();
    }
  }
  const ICONS = { chart: iconChart, house: iconHouse, policy: iconPolicy };

  // ---------- 장면: 뉴스 ----------
  function drawNews(lt, idx) {
    const n = data.news[idx];
    drawSkyline(lt + 10, 1, 0.25);
    // 상단 진행 표시
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < idx ? YELLOW : 'rgba(255,255,255,.18)';
      roundRect(90 + i * 310, 120, 280, 14, 7); ctx.fill();
      if (i === idx) { ctx.fillStyle = YELLOW; roundRect(90 + i * 310, 120, 280 * clamp(lt / NEWS), 14, 7); ctx.fill(); }
    }
    // 번호 배지
    const b = back(prog(lt, 0, 0.5));
    ctx.save(); ctx.translate(180, 300); ctx.scale(b, b);
    ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI*2); ctx.fill();
    font(110, 900); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(idx + 1), 0, 6); ctx.restore();
    const a0 = easeOut(prog(lt, 0.15, 0.5));
    ctx.save(); ctx.globalAlpha = a0;
    font(46, 700); ctx.fillStyle = MUTED; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`NEWS ${idx + 1} / 3`, 310 - (1-a0)*40, 300);
    ctx.restore();

    // 아이콘
    (ICONS[n.icon] || iconChart)(lt, W/2, 760);

    // 헤드라인 카드
    const c = easeOut(prog(lt, 0.3, 0.6));
    ctx.save(); ctx.globalAlpha = c; ctx.translate(0, (1-c) * 120);
    font(80, 900);
    const lines = wrap(n.headline, 860).slice(0, 4);
    const lh = 108, cardH = lines.length * lh + 120, top = 1180;
    ctx.fillStyle = 'rgba(22,30,51,.94)'; roundRect(60, top, W - 120, cardH, 36); ctx.fill();
    ctx.fillStyle = YELLOW; roundRect(60, top, 16, cardH, 8); ctx.fill();
    ctx.fillStyle = TEXT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => {
      const lp = easeOut(prog(lt, 0.5 + i * 0.18, 0.45));
      ctx.save(); ctx.globalAlpha = lp; ctx.fillText(l, 110 + (1-lp) * 40, top + 60 + i * lh); ctx.restore();
    });
    ctx.restore();

    // 출처
    const s = easeOut(prog(lt, 1.2, 0.5));
    ctx.save(); ctx.globalAlpha = s;
    font(44, 500); ctx.fillStyle = MUTED; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`출처: ${n.source}`, W/2, 1180 + lines.length * lh + 200);
    ctx.restore();
  }

  // ---------- 장면: 마무리 ----------
  function drawOutro(lt) {
    drawSkyline(lt + 20, 1, 0.6);
    const a = back(prog(lt, 0.1, 0.7));
    ctx.save(); ctx.translate(W/2, 600); ctx.scale(a, a);
    font(96, 900); ctx.fillStyle = TEXT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('내일 아침에도', 0, -70);
    ctx.fillStyle = YELLOW; ctx.fillText('1분 부동산 뉴스', 0, 60);
    ctx.restore();
    // 구독 버튼
    const b = easeOut(prog(lt, 0.8, 0.5));
    const pulse = 1 + Math.sin(lt * 6) * 0.04 * b;
    ctx.save(); ctx.globalAlpha = b; ctx.translate(W/2, 900); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ff0033'; roundRect(-260, -80, 520, 160, 80); ctx.fill();
    font(68, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('구독 · 좋아요', 0, 4);
    ctx.restore();
    // 손가락 탭
    const tp = prog(lt, 1.6, 0.6);
    if (tp > 0 && tp < 1) {
      ctx.save(); ctx.globalAlpha = 1 - tp; ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(W/2 + 180, 920, 30 + tp * 90, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    }
    // 안내
    const d = easeOut(prog(lt, 1.2, 0.6));
    ctx.save(); ctx.globalAlpha = d;
    font(40, 500); ctx.fillStyle = MUTED; ctx.textAlign = 'center';
    ctx.fillText('본 영상은 뉴스 요약이며 투자 권유가 아닙니다', W/2, 1110);
    ctx.fillText('AI 음성으로 제작되었습니다', W/2, 1170);
    ctx.restore();
  }

  // ---------- 렌더 ----------
  function render(t) {
    ctx.clearRect(0, 0, W, H);
    drawBackground(t);
    let scene, lt, len;
    if (t < INTRO) { scene = 'intro'; lt = t; len = INTRO; }
    else if (t < INTRO + NEWS * 3) { const k = Math.floor((t - INTRO) / NEWS); scene = k; lt = t - INTRO - k * NEWS; len = NEWS; }
    else { scene = 'outro'; lt = t - INTRO - NEWS * 3; len = OUTRO; }
    // 장면 사이 전환: 끝부분에서 살짝 밀려나며 사라짐
    const out = scene === 'outro' ? 0 : easeInOut(prog(lt, len - 0.4, 0.4));
    ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(-out * 120, 0);
    if (scene === 'intro') drawIntro(lt);
    else if (scene === 'outro') drawOutro(lt);
    else drawNews(lt, scene);
    ctx.restore();
    // 하단 채널명
    font(36, 700); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('부동산 정보 룽숏', W/2, H - 90);
  }
  window.renderAt = render; // 프레임 단위 렌더용

  // ---------- 재생 ----------
  const playBtn = document.getElementById('play'), recBtn = document.getElementById('rec');
  const progEl = document.getElementById('prog'), statusEl = document.getElementById('status');
  let playing = false, t0 = 0, cur = 0, onEnd = null;

  function frame(now) {
    if (!playing) return;
    cur = (now - t0) / 1000;
    if (cur >= DURATION) {
      cur = DURATION; render(DURATION - 0.001); playing = false; setBtn();
      progEl.style.width = '100%';
      if (onEnd) { const f = onEnd; onEnd = null; f(); }
      return;
    }
    render(cur); progEl.style.width = (cur / DURATION * 100) + '%';
    requestAnimationFrame(frame);
  }
  function play(from) {
    if (from !== undefined) cur = from;
    if (cur >= DURATION) cur = 0;
    t0 = performance.now() - cur * 1000; playing = true; setBtn(); requestAnimationFrame(frame);
  }
  function pause() { playing = false; setBtn(); }
  function setBtn() { playBtn.textContent = playing ? '❚❚ 일시정지' : '▶ 재생'; }

  playBtn.onclick = () => playing ? pause() : play();
  document.getElementById('restart').onclick = () => play(0);

  // ---------- 녹화 ----------
  recBtn.onclick = () => {
    if (!cv.captureStream || !window.MediaRecorder) { statusEl.textContent = '이 브라우저는 영상 저장을 지원하지 않아요. 화면 녹화를 이용해 주세요.'; return; }
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const stream = cv.captureStream(30);
    let rec;
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 }); }
    catch (e) { statusEl.textContent = '녹화를 시작할 수 없어요: ' + e.message; return; }
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const type = rec.mimeType || mime || 'video/webm';
      const blob = new Blob(chunks, { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `shorts-${today.toISOString().slice(0,10)}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
      document.body.appendChild(a); a.click(); a.remove();
      statusEl.textContent = '저장 완료!'; recBtn.disabled = false;
    };
    recBtn.disabled = true; statusEl.textContent = `녹화 중… (${Math.round(DURATION)}초) 탭을 닫지 마세요`;
    rec.start();
    onEnd = () => setTimeout(() => rec.stop(), 300);
    play(0);
  };

  // ---------- 편집 폼 ----------
  const dateEl = document.getElementById('date'), titleEl = document.getElementById('title');
  dateEl.value = data.date; titleEl.value = data.title;
  const ICON_NAMES = { chart: '📈 가격 그래프', house: '🏠 집 · 매물', policy: '📄 정책 문서' };
  const forms = document.getElementById('newsForms');
  data.news.forEach((n, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h2>뉴스 ${i+1}</h2>
      <label for="h${i}">헤드라인 (짧을수록 좋아요)</label><textarea id="h${i}" maxlength="60"></textarea>
      <div class="row"><div><label for="s${i}">출처 언론사</label><input id="s${i}"></div>
      <div><label for="i${i}">그림</label><select id="i${i}">${Object.entries(ICON_NAMES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></div></div>`;
    forms.appendChild(card);
    const h = card.querySelector('textarea'), s = card.querySelector('input'), ic = card.querySelector('select');
    h.value = n.headline; s.value = n.source; ic.value = n.icon;
    const upd = () => { n.headline = h.value; n.source = s.value; n.icon = ic.value; save();
      if (!playing) { cur = INTRO + i * NEWS + 3.5; render(cur); progEl.style.width = (cur / DURATION * 100) + '%'; } };
    h.oninput = s.oninput = ic.onchange = upd;
  });
  const updTop = () => { data.date = dateEl.value; data.title = titleEl.value; save(); if (!playing) { cur = 2.5; render(cur); } };
  dateEl.oninput = titleEl.oninput = updTop;

  // 글꼴이 준비되면 첫 화면 그리기
  render(2.5);
  const ready = document.fonts ? Promise.all([document.fonts.load(`900 80px "Noto Sans KR"`), document.fonts.load(`500 40px "Noto Sans KR"`)]) : Promise.resolve();
  ready.catch(() => {}).then(() => { if (!playing) render(cur || 2.5); });
})();
</script>
</body>
</html>
